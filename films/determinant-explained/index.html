<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Determinant, explained</title>
<link rel="stylesheet" href="/engine/lib/fonts.css">
</head>
<body>
<script type="module">
// The Determinant, explained. A live coordinate plane is the spine: its parallelogram label is always
// the real det of the matrix it is showing. Times are on the 120 bpm grid (bar = 2 s). Plan: shotlist.md.
import { film } from '/engine/lib/runtime.js';
import { loadDesign } from '/engine/lib/design.js';
import * as M from '/engine/lib/motion.js';

let D, cfg, C;
const MINUS = '\u2212', DOT = '\u00b7', TIMES = '\u00d7';
const SERIF = '"Instrument Serif"', MONO = '"JetBrains Mono"';
// Feels: type is critically damped (no overshoot), UI snappy, the plane's transforms slower.
const F = { type: [200, 28.3], ui: M.SNAPPY, box: M.DEFAULT, slow: [110, 21], flip: [36, 12] };
const sp = (t, f) => M.spring(t, ...f);
const cl = M.clamp;
const num = (v) => (Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v)) : v.toFixed(1)).replace('-', MINUS).replace(/^−0$/, '0');

function setFont(ctx, px, fam, italic = false, weight = 400, track = 0) { M.font(ctx, px, fam, weight, track, italic ? 'italic' : ''); }

// A track whose every key carries its own feel: [[t, value, feel], ...]
function ktrack(t, keys, idx) {
  const at = (k) => (idx == null ? k[1] : k[1][idx]);
  let v = at(keys[0]);
  for (let i = 1; i < keys.length; i++) v += (at(keys[i]) - at(keys[i - 1])) * sp(t - keys[i][0], keys[i][2] || F.box);
  return v;
}

// ── layout: A = words + matrix, B = the plane (landscape: side by side; portrait: stacked) ──────────
function lay(L) {
  const u = L.u, P = L.portrait;
  const A = P ? { x: L.W * 0.08, y: L.H * 0.1, w: L.W * 0.84, h: L.H * 0.4 } : { x: L.W * 0.06, y: L.H * 0.1, w: L.W * 0.4, h: L.H * 0.8 };
  const B = P ? { x: L.W * 0.05, y: L.H * 0.5, w: L.W * 0.9, h: L.H * 0.33 } : { x: L.W * 0.5, y: L.H * 0.08, w: L.W * 0.44, h: L.H * 0.84 };
  const h1 = A.y + 14 * u, b1 = A.y + A.h * (P ? 0.8 : 0.86);
  const S = { k: A.y + 3 * u, h1, h2: h1 + 10 * u, mat: A.y + A.h * (P ? 0.56 : 0.58), matSize: (P ? 9 : 10) * u,
    m3: P ? L.H * 0.36 : A.y + A.h * 0.64, m3Size: (P ? 6.8 : 9) * u, b1, b2: b1 + 5.5 * u };
  const OFF = P ? { ...B, y: B.y + L.H * 0.62 } : { ...B, x: B.x + L.W * 0.6 };
  // portrait only: the plane sits under the formula while it is being worked out
  const BF = P ? { x: B.x, y: L.H * 0.575, w: B.w, h: L.H * 0.255 } : OFF;
  return { A, B, S, OFF, BF, FULL: { x: 0, y: 0, w: L.W, h: L.H } };
}

// ── type helpers ─────────────────────────────────────────────────────────────────────────────────────
// Words rise out of a clip on tIn and leave upwards on tOut (never a plain fade).
function words(ctx, text, x, y, t, tIn, tOut = 1e9, o = {}) {
  if (t < tIn - 0.01 || t > tOut + 1.2) return 0;
  const { color = D.c.ink, align = 'left', stagger = D.stagger } = o;
  const ws = text.split(' '), space = ctx.measureText(' ').width, wd = ws.map((w) => ctx.measureText(w).width);
  const total = wd.reduce((a, b) => a + b, 0) + space * (ws.length - 1);
  const m = ctx.measureText('Hgjy(|'), asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent, lh = asc + desc;
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  const pad = lh * 0.3;
  ws.forEach((w, i) => {
    const pin = sp(t - tIn - i * stagger, F.type), pout = sp(t - tOut - i * stagger * 0.6, F.ui);
    if (pin > 0.001 && pout < 0.999) {
      ctx.save(); ctx.beginPath(); ctx.rect(cx - pad, y - asc - pad * 0.5, wd[i] + pad * 2, lh + pad); ctx.clip();
      ctx.globalAlpha = cl(pin * 2) * cl(1 - pout);
      ctx.fillStyle = typeof color === 'function' ? color(i, w) : color;
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(w, cx, y + (1 - pin) * lh * 1.15 - cl(pout) * lh * 1.15);
      ctx.restore();
    }
    cx += wd[i] + space;
  });
  return total;
}

// Segments of mixed style on one baseline: [{ s, it, c, at, k, fam, hide }]. Returns centers.
function rich(ctx, segs, x, y, t, o = {}) {
  const { size, align = 'left', tOut = 1e9, alpha = 1 } = o;
  const fontOf = (g) => setFont(ctx, size * (g.k || 1), g.fam || SERIF, !!g.it);
  const wd = segs.map((g) => { fontOf(g); return ctx.measureText(g.s).width; });
  const total = wd.reduce((a, b) => a + b, 0);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  const out = [];
  segs.forEach((g, i) => {
    out.push({ x: cx + wd[i] / 2, y, w: wd[i], x0: cx });
    const pin = g.at == null ? 1 : sp(t - g.at, F.type), pout = sp(t - tOut - i * 0.02, F.ui);
    if (!g.hide && pin > 0.001 && pout < 0.999 && g.s.trim()) {
      fontOf(g);
      const px = size * (g.k || 1), lh = px * 1.1;
      ctx.save(); ctx.beginPath(); ctx.rect(cx - px * 0.2, y - px * 0.95, wd[i] + px * 0.4, px * 1.3); ctx.clip();
      ctx.globalAlpha = alpha * cl(pin * 2) * cl(1 - pout);
      ctx.fillStyle = g.c || D.c.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(g.s, cx, y + (1 - pin) * lh - cl(pout) * lh);
      ctx.restore();
    }
    cx += wd[i];
  });
  return out;
}

const kicker = (ctx, L, text, x, y, t, a, b) => { setFont(ctx, 3.2 * L.u, MONO, false, 600, 0.08); return words(ctx, text, x, y, t, a, b, { color: D.c.accentInk, stagger: 0.03 }); };
const head = (ctx, L, text, x, y, t, a, b, o) => { setFont(ctx, (L.portrait ? 9.5 : 9) * L.u, SERIF); return words(ctx, text, x, y, t, a, b, o); };
const body = (ctx, L, text, x, y, t, a, b, o) => { setFont(ctx, (L.portrait ? 4 : 3.6) * L.u, MONO, false, 500, -0.01); return words(ctx, text, x, y, t, a, b, o); };

// An expanding ring that stamps an answer.
function stamp(ctx, L, x, y, t, t0, color, r0 = 5) {
  const p = (t - t0) / 0.7; if (p < 0 || p > 1) return;
  ctx.save(); ctx.strokeStyle = color; ctx.globalAlpha = cl(1 - p) * 0.8; ctx.lineWidth = L.u * 0.35 * (1 - p) + 1;
  ctx.beginPath(); ctx.arc(x, y, L.u * (r0 + 6 * M.ease.outCubic(p)), 0, M.TAU); ctx.stroke(); ctx.restore();
}

// ── matrices ─────────────────────────────────────────────────────────────────────────────────────────
// Brackets grow from the center, entries rise in one by one. style(i, j) → { s, it, c, a, dx, dy, hide, swap: { to, at, it, c } }
function mgeom(x, y, R, Cn, size) {
  const cw = size * 1.4, rh = size * 1.28, W = Cn * cw, H = R * rh;
  const centers = [];
  for (let i = 0; i < R; i++) { centers.push([]); for (let j = 0; j < Cn; j++) centers[i].push([x - W / 2 + cw * (j + 0.5), y - H / 2 + rh * (i + 0.5)]); }
  return { cw, rh, W, H, centers };
}
function matrix(ctx, L, x, y, t, o) {
  const { cells, size, tIn, tOut = 1e9, bars = false, barP = 0, stagger = 0.07, it = false, style } = o;
  const R = cells.length, Cn = cells[0].length, g = mgeom(x, y, R, Cn, size);
  const pIn = sp(t - tIn, F.box), pOut = sp(t - tOut, F.ui);
  if (pIn <= 0.001 || pOut >= 0.999) return g;
  const A = cl(1 - pOut * 1.5);
  ctx.save();
  // brackets
  const bh = (g.H + size * 0.25) * M.lerp(0.15, 1, cl(pIn)), lx = x - g.W / 2 - size * 0.12, rx = x + g.W / 2 + size * 0.12;
  const top = y - bh / 2, bot = y + bh / 2, tick = bars ? 0 : size * 0.26 * (1 - cl(barP));
  ctx.globalAlpha = A * cl(pIn * 3); ctx.strokeStyle = D.c.ink; ctx.lineWidth = Math.max(2, size * 0.055); ctx.lineCap = 'square'; ctx.lineJoin = 'miter';
  ctx.beginPath(); ctx.moveTo(lx + tick, top); ctx.lineTo(lx, top); ctx.lineTo(lx, bot); ctx.lineTo(lx + tick, bot);
  ctx.moveTo(rx - tick, top); ctx.lineTo(rx, top); ctx.lineTo(rx, bot); ctx.lineTo(rx - tick, bot); ctx.stroke();
  // entries
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  for (let i = 0; i < R; i++) for (let j = 0; j < Cn; j++) {
    const st = style ? style(i, j) || {} : {};
    if (st.hide) continue;
    const p = sp(t - (tIn + 0.12 + (i * Cn + j) * stagger), F.type);
    const a = cl(p * 2) * A * (st.a ?? 1);
    if (a <= 0.002) continue;
    const [cx0, cy0] = g.centers[i][j], cx = cx0 + (st.dx || 0), cy = cy0 + (st.dy || 0);
    const yy = cy + size * 0.33 + (1 - p) * size * 0.45 + cl(pOut) * size * 0.4;
    ctx.globalAlpha = a;
    const s0 = st.s ?? cells[i][j];
    if (st.swap) {
      const q = sp(t - st.swap.at, F.type);
      ctx.save(); ctx.beginPath(); ctx.rect(cx - g.cw / 2, cy - g.rh / 2, g.cw, g.rh); ctx.clip();
      if (q < 0.999) { setFont(ctx, size, SERIF, st.it ?? it); ctx.fillStyle = st.c || D.c.ink; ctx.fillText(s0, cx, yy - q * g.rh * 0.8); }
      if (q > 0.001) { setFont(ctx, size, SERIF, !!st.swap.it); ctx.fillStyle = st.swap.c || D.c.ink; ctx.fillText(st.swap.to, cx, yy + (1 - q) * g.rh * 0.8); }
      ctx.restore();
    } else { setFont(ctx, size, SERIF, st.it ?? it); ctx.fillStyle = st.c || D.c.ink; ctx.fillText(s0, cx, yy); }
  }
  ctx.restore();
  return g;
}

// ── the live plane ───────────────────────────────────────────────────────────────────────────────────
const I2 = [1, 0, 0, 1], A2 = [3, 1, 1, 2];
const MAT = [[0, I2], [0.3, A2, F.slow], [7.3, I2, F.box], [10.0, [3, 0, 1, 1], F.slow], [11.5, A2, F.slow],
  [29.0, [1, 3, 2, 1], F.flip], [34.5, [2, 4, 1, 2], F.flip]];
let VIEW;
const viewKeys = (P) => [[0, [0.5, 0.5, 2.4]], [0.3, [2, P ? 0.9 : 1.5, 7], F.slow], [3.9, [2, 1.5, P ? 5.4 : 6.2], F.box], [34.4, [3, 1.5, P ? 6.8 : 7.6], F.box]];
const matAt = (t) => [0, 1, 2, 3].map((k) => ktrack(t, MAT, k));

function planeRect(t) {
  const K = [[0, C.FULL], [3.9, C.B, F.box], [16.0, C.OFF, F.box], [22.5, C.BF, F.box], [26.95, C.B, F.box], [39.8, C.OFF, F.box]];
  const f = (p) => ktrack(t, K.map((k) => [k[0], k[1][p], k[2]]));
  return { x: f('x'), y: f('y'), w: f('w'), h: f('h') };
}

function arrow(ctx, L, x0, y0, x1, y1, color, w) {
  const a = Math.atan2(y1 - y0, x1 - x0), len = Math.hypot(x1 - x0, y1 - y0), hl = Math.min(L.u * 2.4, len * 0.45);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - Math.cos(a) * hl * 0.6, y1 - Math.sin(a) * hl * 0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - Math.cos(a - 0.42) * hl, y1 - Math.sin(a - 0.42) * hl); ctx.lineTo(x1 - Math.cos(a + 0.42) * hl, y1 - Math.sin(a + 0.42) * hl);
  ctx.closePath(); ctx.fill();
}

// Color of signed area: amber when positive, red when flipped.
const signCol = (det) => M.mix(D.c.accent, D.c.neg, M.smoothstep(0.25, -0.25, det));
const signInk = (det) => M.mix(D.c.accentInk, D.c.neg, M.smoothstep(0.25, -0.25, det));
const withA = (rgb, a) => rgb.replace('rgb(', 'rgba(').replace(')', `,${cl(a)})`);

function drawPlane(ctx, t, L) {
  const r = planeRect(t);
  if (r.x >= L.W || r.y >= L.H) return;
  const v = [0, 1, 2].map((k) => ktrack(t, VIEW, k)), u = L.u;
  const s = Math.min(r.w, r.h) / v[2];
  const ox = r.x + r.w / 2 - v[0] * s, oy = r.y + r.h / 2 + v[1] * s;
  const m = matAt(t), det = m[0] * m[3] - m[1] * m[2];
  const P = (x, y) => [ox + (m[0] * x + m[1] * y) * s, oy - (m[2] * x + m[3] * y) * s];
  const Q = (x, y) => [ox + x * s, oy - y * s];
  const line = (a, b) => { ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); };

  ctx.save();
  M.rrect(ctx, r.x, r.y, r.w, r.h, u * 2.2 * cl(sp(t - 3.9, F.box)));
  ctx.fillStyle = D.c.surface; ctx.fill(); ctx.clip();
  // the untouched grid, for reference
  ctx.strokeStyle = D.c.gridBase; ctx.lineWidth = Math.max(1, u * 0.1); ctx.beginPath();
  for (let i = -24; i <= 28; i++) { line(Q(i, -40), Q(i, 40)); line(Q(-40, i), Q(40, i)); }
  ctx.stroke();
  // the grid the matrix made
  ctx.strokeStyle = M.rgba(D.c.grid, M.smoothstep(0.15, 1.2, Math.abs(det))); ctx.lineWidth = Math.max(1.2, u * 0.14); ctx.beginPath();
  for (let i = -24; i <= 28; i++) { if (i) { line(P(i, -40), P(i, 40)); line(P(-40, i), P(40, i)); } }
  ctx.stroke();
  ctx.strokeStyle = M.rgba(D.c.ink, 0.35); ctx.lineWidth = Math.max(1.5, u * 0.2); ctx.beginPath();
  line(P(0, -40), P(0, 40)); line(P(-40, 0), P(40, 0)); ctx.stroke();

  // the unit square, carried by the matrix
  const col = signCol(det), p0 = P(0, 0), p1 = P(1, 0), p2 = P(1, 1), p3 = P(0, 1);
  ctx.beginPath(); ctx.moveTo(...p0); ctx.lineTo(...p1); ctx.lineTo(...p2); ctx.lineTo(...p3); ctx.closePath();
  ctx.fillStyle = withA(col, 0.3); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = u * 0.35; ctx.lineJoin = 'round'; ctx.stroke();

  // orientation arc (sign section): turns the other way once space flips
  const oa = cl(M.life(t, 28.3, 33.9, F.box)) * M.smoothstep(0.15, 0.6, Math.abs(det));
  if (oa > 0.01) {
    const th1 = Math.atan2(-m[2], m[0]), th2 = Math.atan2(-m[3], m[1]), R = s * 0.55, ccw = det > 0;
    let d = th2 - th1; if (ccw && d > 0) d -= M.TAU; if (!ccw && d < 0) d += M.TAU;
    const a0 = th1 + d * 0.12, a1 = th1 + d * 0.8;
    ctx.globalAlpha = oa; ctx.strokeStyle = signInk(det); ctx.fillStyle = signInk(det); ctx.lineWidth = u * 0.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(ox, oy, R, a0, a1, ccw); ctx.stroke();
    const hx = ox + Math.cos(a1) * R, hy = oy + Math.sin(a1) * R, tang = a1 + (ccw ? -Math.PI / 2 : Math.PI / 2), hl = u * 1.6;
    ctx.beginPath(); ctx.moveTo(hx + Math.cos(tang) * hl, hy + Math.sin(tang) * hl);
    ctx.lineTo(hx + Math.cos(tang + 2.5) * hl, hy + Math.sin(tang + 2.5) * hl); ctx.lineTo(hx + Math.cos(tang - 2.5) * hl, hy + Math.sin(tang - 2.5) * hl); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // the two columns as vectors (highlighted while the matrix shows that column)
  const hl1 = cl(M.life(t, 9.9, 11.5, F.box, 0.3)), hl2 = cl(M.life(t, 11.4, 13.0, F.box, 0.3));
  arrow(ctx, L, ...p0, ...p1, M.mix(D.c.ink, D.c.accentInk, hl1), u * (0.45 + 0.25 * hl1));
  arrow(ctx, L, ...p0, ...p3, M.mix(D.c.ink, D.c.accentInk, hl2), u * (0.45 + 0.25 * hl2));
  ctx.beginPath(); ctx.arc(...p0, u * 0.7, 0, M.TAU); ctx.fillStyle = D.c.ink; ctx.fill();

  // coordinates at the tips
    const hide = Math.max(...[[28.85, 30.3], [34.4, 35.9]].map(([a, b]) => Math.min(cl((t - a) / 0.12), cl((b - t) / 0.3))));
  const la = cl(M.life(t, 9.8, 39.9, F.box)) * (1 - hide);
  if (la > 0.01) {
    setFont(ctx, (L.portrait ? 3.6 : 3.2) * u, MONO, false, 600); ctx.textBaseline = 'middle'; ctx.fillStyle = M.rgba(D.c.ink, 0.85 * la);
    for (const [tip, cx, cy, side] of [[p1, m[0], m[2], 1], [p3, m[1], m[3], -1]]) {
      // along the vector, then off to its own side, so the two tags never share a line
      const dx = tip[0] - ox, dy = tip[1] - oy, dl = Math.hypot(dx, dy) || 1, nx = (-dy / dl) * side, ny = (dx / dl) * side;
      const lx = tip[0] + (dx / dl) * u * 1.5 + nx * u * 3, ly = tip[1] + (dy / dl) * u * 1.5 + ny * u * 3;
      ctx.textAlign = lx >= tip[0] ? 'left' : 'right';
      ctx.fillText(`(${num(cx)}, ${num(cy)})`, lx, ly);
    }
  }

  // the live determinant, sitting inside the shape it measures
  const [gx, gy] = P(0.5, 0.5), size = M.lerp(12, 8, cl(sp(t - 3.9, F.box))) * u;
  const lift = M.smoothstep(2.5, 0, Math.abs(det)) * u * 8;
  setFont(ctx, size, SERIF); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = signInk(det); ctx.fillText(num(det), gx, gy + size * 0.33 - lift);
  ctx.restore();
}

// ── scenes ───────────────────────────────────────────────────────────────────────────────────────────
function hook(ctx, t, L) {
  const u = L.u, x = L.safe.x, y = L.safe.y + 9 * u;
  head(ctx, L, 'This matrix made', x, y, t, 0.7, 3.65);
  head(ctx, L, 'every area 5× bigger.', x, y + 10 * u, t, 0.85, 3.7, { color: (i, w) => (w === '5×' ? D.c.accentInk : D.c.ink) });
  const my = L.portrait ? L.H * 0.66 : L.H * 0.74, size = (L.portrait ? 7 : 6) * u;
  const lab = rich(ctx, [{ s: 'A', it: true, at: 1.3 }, { s: ' =', at: 1.35 }], x, my + size * 0.33, t, { size: size * 1.1, tOut: 3.7 });
  const g = mgeom(0, 0, 2, 2, size);
  matrix(ctx, L, lab[1].x0 + lab[1].w + size * 0.6 + g.W / 2, my, t, { cells: [['3', '1'], ['1', '2']], size, tIn: 1.38, tOut: 3.7 });
}

function title(ctx, t, L) {
  const { A } = C, u = L.u;
  const px = Math.min(M.fitPx(ctx, 'Determinant', A.w, SERIF, 400), 17 * u);
  const y1 = A.y + 7 * u, y2 = y1 + px * 0.95;
  head(ctx, L, 'The', A.x, y1, t, 3.95, 7.6);
  setFont(ctx, px, SERIF, false, 400, -0.02); words(ctx, 'Determinant', A.x - px * 0.03, y2, t, 4.0, 7.62);
  const items = ['01  what it means', '02  how to compute it', '03  what its sign says', '04  3×3 in three steps'];
  items.forEach((s, i) => body(ctx, L, s, A.x, y2 + 10 * u + i * 5.4 * u, t, 5.0 + i * 0.5, 7.5 + i * 0.03, { color: i === 0 ? D.c.ink : D.c.muted }));
}

function meaning(ctx, t, L) {
  const { A, S } = C, u = L.u;
  kicker(ctx, L, '01 · WHAT IT MEANS', A.x, S.k, t, 8.0, 15.9);
  head(ctx, L, 'A matrix moves', A.x, S.h1, t, 8.1, 12.7); head(ctx, L, 'all of space.', A.x, S.h2, t, 8.2, 12.72);
  head(ctx, L, 'det = how much', A.x, S.h1, t, 13.0, 15.9); head(ctx, L, 'area stretches.', A.x, S.h2, t, 13.1, 15.92,
    { color: (i) => (i === 1 ? D.c.accentInk : D.c.ink) });
  const size = S.matSize, g = mgeom(0, 0, 2, 2, size), mx = A.x + g.W / 2 + size * 0.3;
  // column highlight boxes, synced with the plane
  for (const [j, a, b] of [[0, 9.9, 11.5], [1, 11.4, 13.0]]) {
    const p = cl(M.life(t, a, b, F.box, 0.3)); if (p < 0.01) continue;
    const gg = mgeom(mx, S.mat, 2, 2, size), cx = gg.centers[0][j][0];
    ctx.fillStyle = M.rgba(D.c.accent, 0.25 * p);
    M.rrect(ctx, cx - gg.cw * 0.42, S.mat - (gg.H / 2 + size * 0.2) * p, gg.cw * 0.84, (gg.H + size * 0.4) * p, u * 1.2); ctx.fill();
  }
  matrix(ctx, L, mx, S.mat, t, { cells: [['3', '1'], ['1', '2']], size, tIn: 8.88, tOut: 15.9 });

    setFont(ctx, 3.6 * u, MONO, false, 500); ctx.fillStyle = D.c.ink; ctx.fillText(cd.cap, 4 * u, fy + 7 * u);
    const gx = w - h * 0.32, gy = h / 2, gs = h * 0.13, gp = cl(sp(t - tin - 0.2, F.slow));
    if (cd.g === 'pos') miniPara(ctx, gx, gy, gs, [M.lerp(1, 3, gp) * 0.5, 0.5 * gp * 1, 0.5 * gp, M.lerp(1, 2, gp) * 0.5].map((v) => v * 1.6), D.c.accent);
    if (cd.g === 'neg') miniPara(ctx, gx, gy, gs, [M.lerp(3, 1, gp), M.lerp(1, 3, gp), M.lerp(1, 2, gp), M.lerp(2, 1, gp)].map((v) => v * 0.8), M.mix(D.c.accent, D.c.neg, M.smoothstep(0.4, 0.6, gp)).replace(/rgb\((\d+),(\d+),(\d+)\)/, (_, r, g, b) => '#' + [r, g, b].map((n) => (+n).toString(16).padStart(2, '0')).join('')));
    if (cd.g === 'zero') miniPara(ctx, gx, gy, gs, [2, M.lerp(1, 4, gp), 1, M.lerp(2.5, 2, gp)].map((v) => v * 0.6), D.c.ink);
    if (cd.g === 'x') {
      const s2 = gs * 1.1, lw = u * 1.2;
      ctx.lineCap = 'round'; ctx.lineWidth = lw;
      ctx.strokeStyle = M.rgba(D.c.accent, 0.8); ctx.beginPath(); ctx.moveTo(gx - s2, gy - s2); ctx.lineTo(gx - s2 + 2 * s2 * gp, gy - s2 + 2 * s2 * gp); ctx.stroke();
      const g2 = cl(sp(t - tin - 0.45, F.slow));
      ctx.strokeStyle = M.rgba(D.c.neg, 0.7); ctx.beginPath(); ctx.moveTo(gx + s2, gy - s2); ctx.lineTo(gx + s2 - 2 * s2 * g2, gy - s2 + 2 * s2 * g2); ctx.stroke();
    }
    ctx.restore();
  });
}

function lockup(ctx, t, L) {
  if (t < 57.45) return;
  const u = L.u, lt = t - 57.5, push = 1 + 0.015 * cl((t - 58) / 2);
  ctx.save(); ctx.translate(L.cx, L.cy); ctx.scale(push, push); ctx.translate(-L.cx, -L.cy);
  const gp = cl(sp(lt - 0.25, F.slow)), m = [M.lerp(1, 3, gp), gp, gp, M.lerp(1, 2, gp)];
  const gcx = L.portrait ? L.cx : L.W * 0.3, gcy = L.portrait ? L.H * 0.36 : L.cy, gs = (L.portrait ? 16 : 17) * u * cl(sp(lt, F.box));
  if (gs > 0.5) {
    miniPara(ctx, gcx, gcy, gs, m, D.c.accent);
    const det = m[0] * m[3] - m[1] * m[2];
    setFont(ctx, 9 * u, SERIF); ctx.fillStyle = D.c.accentInk; ctx.textAlign = 'center'; ctx.fillText(num(det), gcx, gcy + 3 * u);
  }
  const hx = L.portrait ? L.safe.x : L.W * 0.52, hy = L.portrait ? L.H * 0.62 : L.cy + 2 * u;
  setFont(ctx, 16 * u, SERIF); words(ctx, "det(A)", hx, hy, t, 57.7, 1e9, { color: D.c.ink });
  setFont(ctx, 4.2 * u, MONO, false, 500);
  words(ctx, 'one number:', hx, hy + 9 * u, t, 58.3, 1e9, { color: D.c.muted });
  words(ctx, 'how much space stretches', hx, hy + 15 * u, t, 58.4, 1e9, { color: D.c.ink });
  ctx.restore();
}

film({
  async setup(L, c) { cfg = c; D = await loadDesign(); C = lay(L); VIEW = viewKeys(L.portrait); },
  draw(ctx, t, L) {
    ctx.fillStyle = D.c.bg; ctx.fillRect(0, 0, L.W, L.H);
    if (t < 41) drawPlane(ctx, t, L);
    if (t < 4.8) hook(ctx, t, L);
    if (t > 3.9 && t < 8.8) title(ctx, t, L);
    if (t > 7.9 && t < 16.8) meaning(ctx, t, L);
    if (t > 15.9 && t < 28.8) formula(ctx, t, L);
    if (t > 27.9 && t < 34.8) sign(ctx, t, L);
    if (t > 33.9 && t < 41) zero(ctx, t, L);
    if (t > 39.8 && t < 54.7) three(ctx, t, L);
    if (t > 53.5 && t < 58.6) recap(ctx, t, L);
    lockup(ctx, t, L);
  },
});
</script>
