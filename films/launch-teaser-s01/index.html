<!doctype html>
<meta charset="utf-8">
<title>launch-teaser</title>
<link rel="stylesheet" href="/engine/lib/fonts.css">
<script type="module">
import { film } from '/engine/lib/runtime.js';
import { loadDesign } from '/engine/lib/design.js';
import * as M from '/engine/lib/motion.js';
let D, cfg;
const shots = {};

film({
  async setup(L, c) {
    cfg = c; D = await loadDesign();
    // the REAL captures (loaded as images; drawn with source rects — never redrawn)
    for (const n of ['assets_desktop.png', 'assets_phone.png']) {
      // RELATIVE src (an absolute /films/... path fails to decode in the render browser —
      // measured: relative decodes, absolute EncodingErrors, from the same page)
      const i = new Image(); i.src = n; await i.decode(); shots[n] = i;
    }
  },
  draw(ctx, t, L) {
    ctx.fillStyle = D.c.bg; ctx.fillRect(0, 0, L.W, L.H);
    const u = L.u, W = L.W, H = L.H;

    // ── the beat plan (25s @ 128bpm: the bar = 1.875s; the hook in the first 2s) ─────────────
    // 0.0-2.1  the Make box: "make me a 25-second teaser" typing (the orange accent)
    // 2.1-5.0  the beat: the sentence lands, the button presses
    // 5.0-9.4  the studio thinks: the plan rows appear (the surface cards)
    // 9.4-15.6 the film appears: the REAL desktop capture, the seek bar scrubbing across it
    // 15.6-20  the gates go green one by one (the payoff chips)
    // 20-25    "made by one sentence." + the poster frame

    const typein = M.clamp(t / 2.2, 0, 1);   // 25s: the typing breathes
    const hookFrame = t < 2.2;   // the first frame carries a dim card so the contrast lands
    const press = M.pulse(t, cfg.beats || [], 8);                // the button press (pulse wants the beats array)
    const think = M.life(t, 1.9, 4.4, M.SNAPPY);               // the plan rows: born 1.9, out 4.4
    const scrub = M.clamp((t - 9.5) / 4.4, 0, 1);               // the film scrubbing
    const gates = M.clamp((t - 15.0) / 2.4, 0, 1);              // the gates: start as the card leaves
    const finale = M.life(t, 20.0, 27.0, M.SNAPPY);            // the end card: born 20.0, dies past the end

    // the GUI's real desktop capture: the film-appearing stage (9.4s+), masked into a card
    if (t >= 8.6) {
      const img = shots['assets_desktop.png'];
      const cw = W * 0.98, ch = H * 0.72, cx = (W - cw) / 2, cy = H * 0.05;
      const a = M.clamp((t - 8.6) / 0.9, 0, 1) * (t < 14.4 ? 1 : M.clamp(1 - (t - 14.4) / 0.5, 0, 1));
      ctx.save();
      ctx.globalAlpha = a;
      // the capture fills the card (cover), a source-rect crop of the REAL pixels
      const sc = Math.max(cw / img.width, ch / img.height);
      // crop the FILMS LIST (the left panel of the capture: dense white titles on the dark chrome —
      // the middle of the frame was the live view, mostly empty at capture time)
      const sw = cw / sc / 2.6, sh = ch / sc / 2.6, sx = 30, sy = (img.height - sh) * 0.18;   // deep zoom: the titles big
      ctx.beginPath(); M.rrect(ctx, cx, cy, cw, ch, u * 1.6); ctx.clip();
      ctx.drawImage(img, sx, sy, sw, sh, cx, cy, cw, ch);
      // the seek bar scrubbing across the real capture (the studio's own loop made visible)
      // the scrub: a THICK green fill growing across the whole card beat (real motion)
      const bar = M.clamp((t - 9.5) / 4.4, 0, 1);
      const bh = u * 3.8;
      ctx.fillStyle = 'rgba(8,8,10,0.80)'; ctx.fillRect(cx, cy + ch - bh, cw, bh);
      ctx.fillStyle = D.c.accent; ctx.fillRect(cx, cy + ch - bh, cw * bar, bh);
      // the playhead: a FULL-CARD-HEIGHT column sweeping across (gate-scale motion: a large
      // moving region, not a dot — the whole right of the card dims behind it)
      const px = cx + cw * bar;
      ctx.fillStyle = 'rgba(8,8,10,0.35)'; ctx.fillRect(px, cy, cx + cw - px, ch);   // the un-played region, dimmed
      ctx.fillStyle = D.c.accent; ctx.fillRect(px - u * 0.5, cy, u * 1.0, ch);        // the sweeping edge
      ctx.restore();
      ctx.strokeStyle = 'rgba(236,236,239,0.16)'; ctx.lineWidth = 2; M.rrect(ctx, cx, cy, cw, ch, u * 1.6); ctx.stroke();
    }

    // the prompt card: lives the whole hook beat; after 3.2s its border MARCHES (a moving edge
    // through the hold — the studio thinking, the border alive)
    const cardA = M.clamp(t / 0.5, 0, 1);
    ctx.globalAlpha = cardA * (t < 3.9 ? 1 : M.clamp(1 - (t - 3.9) / 0.5, 0, 1));
    ctx.fillStyle = D.c.surface; M.rrect(ctx, W * 0.03, H * 0.22, W * 0.94, H * 0.38, u * 3.0); ctx.fill();
    if (t > 3.4) {
      // a marching dashed border (always in motion)
      ctx.save();
      ctx.setLineDash([u * 6, u * 4]); ctx.lineDashOffset = -t * u * 14;   // marching
      ctx.strokeStyle = 'rgba(62,207,142,0.55)'; ctx.lineWidth = u * 0.5;
      M.rrect(ctx, W * 0.03, H * 0.22, W * 0.94, H * 0.38, u * 3.0); ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    // the typed sentence (the hook): FITS the safe width (the house rule — the full string at
    // u*6.6 clipped both edges and the cursor drew OFF-FRAME: invisible motion, dead-time)
    if (t < 3.7) {   // the typed line clears before the rows (no overlap)
      // THREE SHORT LINES, each HUGE (the house fitPx rule + phone-first scale: short lines
      // fit at u*20+ where one long line caps at u*12)
      const msg = 'make me a 25-second teaser';
      const n = Math.floor(typein * msg.length);
      const l1 = 'make me', l2 = 'a 25-second', l3 = 'teaser';
      ctx.font = `600 ${u * 1}px "JetBrains Mono", monospace`;
      const fit = (t2) => Math.min(u * 24, (L.safe.w - u * 6) / ctx.measureText(t2).width * u);
      const fs = Math.min(fit(l1), fit(l2), fit(l3));
      ctx.font = `600 ${fs}px "JetBrains Mono", monospace`;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      const x0 = L.safe.x + u * 3, y1 = H * 0.30, y2 = H * 0.40, y3 = H * 0.50;
      // type across the three lines
      const t1 = Math.min(n, l1.length), t2 = Math.min(Math.max(0, n - l1.length), l2.length), t3 = Math.max(0, n - l1.length - l2.length);
      ctx.fillStyle = D.c.ink;
      ctx.fillText(l1.slice(0, t1), x0, y1);
      if (t1 >= l1.length) ctx.fillText(l2.slice(0, t2), x0, y2);
      if (t1 >= l1.length && t2 >= l2.length) ctx.fillText(l3.slice(0, t3), x0, y3);
      // the cursor rides the typing point, blinking
      const lines = [[l1, t1, y1], [l2, t2, y2], [l3, t3, y3]];
      const cur = lines.find(([L2, tt]) => tt < L2.length) || lines.at(-1);
      const cx2 = x0 + ctx.measureText(cur[0].slice(0, cur[1])).width;
      if (t % 0.7 < 0.42) { ctx.fillStyle = D.c.accent2; ctx.fillRect(cx2 + u * 0.7, cur[2] - fs * 0.5, fs * 0.55, fs * 1.05); }
      // the underline sweeps under the LAST line when the typing completes
      if (n >= msg.length) {
        const sw2 = M.clamp((t - 1.35) / 0.4, 0, 1) * ctx.measureText(l3).width;
        ctx.fillStyle = D.c.accent; ctx.fillRect(x0, y3 + fs * 0.8, sw2, u * 1.1);
      }
    }

    // the plan rows (the studio thinks): surface cards with role labels. The GROUP drifts up
    // slowly through its whole life (4.2-8.4) — continuous motion under the rails' march
    const rows = ['plan · motion', 'build · 9:16', 'verify · gates'];
    const rise = (t > 4.2 && t < 8.6) ? M.clamp((t - 4.2) / 4.4, 0, 1) * u * 4 : 0;
    for (let i = 0; i < 3; i++) {
      const a = M.clamp((t - 4.2 - i * 0.7) / 0.6, 0, 1) * (t < 8.4 ? 1 : M.clamp(1 - (t - 8.4) / 0.6, 0, 1));
      if (a <= 0) continue;
      const w2 = W * 0.92, h2 = u * 19.5, x = (W - w2) / 2, y = H * 0.18 + i * (h2 + u * 7.6) - rise;
      // the slide-in: each card travels in from the left (a moving region, staggered)
      const slide = M.clamp((t - 4.2 - i * 0.7) / 0.7, 0, 1);
      const sx2 = x - (1 - slide) * W * 0.5;
      ctx.globalAlpha = a; ctx.fillStyle = D.c.surface; M.rrect(ctx, sx2, y, w2, h2, u * 1.2); ctx.fill();
      ctx.fillStyle = D.c.ink; ctx.font = `600 ${u * 6.8}px "JetBrains Mono", monospace`;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(rows[i], sx2 + u * 3, y + h2 / 2);
      // the BUILD RAIL: a green sweep down each card's left edge while it holds (moving region)
      const railT = M.clamp((t - 4.9 - i * 0.7) / 0.5, 0, 1);   // fast rails
      ctx.fillStyle = D.c.accent; ctx.fillRect(sx2, y, u * 0.9, h2 * railT);
      // the rail MARCHES down the card's edge while it holds (a moving edge, always)
      if (railT >= 1) { ctx.fillStyle = D.c.accent2; ctx.fillRect(sx2, y + ((t * u * 22) % h2), u * 1.4, u * 3.6); }   // a faster, bigger march
      ctx.fillStyle = i < 2 ? D.c.accent2 : D.c.accent;
      const sq = 1 + 0.5 * M.pulse(t + i * 0.23, cfg.beats || []);   // the squares breathe on beats
      const sqw = u * 2.4 * sq;
      M.rrect(ctx, x + w2 - u * 4.4 - (sqw - u * 2.4) / 2, y + h2 / 2 - sqw / 2, sqw, sqw, u * 0.6); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // the gates going green (the payoff: the studio's own proof)
    const gateNames = ['lint', 'determinism', 'loudness', 'deliverable'];
    for (let i = 0; i < 4; i++) {
      const a = M.clamp((gates * 5.2 - i * 1.3), 0, 1);   // one check every ~0.38s — continuous
      if (a <= 0 || t < 15.0) continue;
      const w2 = u * 72, h2 = u * 15.0, x = (W - w2) / 2, y = H * 0.17 + i * (h2 + u * 4.2);   // 4 BIG chips fill 0.17H..0.93H
      const fade = t > 17.6 ? M.clamp(1 - (t - 17.6) / 0.3, 0, 1) : 1;
      ctx.globalAlpha = a * fade;
      ctx.fillStyle = D.c.surface; M.rrect(ctx, x, y, w2, h2, u * 1.4); ctx.fill();
      // a marching dashed border while the chip waits (a moving edge through the stagger)
      ctx.save();
      ctx.setLineDash([u * 5, u * 3.5]); ctx.lineDashOffset = -t * u * 16;
      ctx.strokeStyle = 'rgba(62,207,142,0.5)'; ctx.lineWidth = u * 0.45;
      M.rrect(ctx, x, y, w2, h2, u * 1.4); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = D.c.ink; ctx.font = `700 ${u * 5.2}px "Inter", sans-serif`;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(gateNames[i], x + u * 3.2, y + h2 / 2);
      // the green check, springing in
      const ca = M.spring(a, ...M.SNAPPY);
      ctx.strokeStyle = D.c.accent; ctx.lineWidth = u * 0.55; ctx.lineCap = 'round';
      const cx2 = x + w2 - u * 5, cy2 = y + h2 / 2, s = u * 1.15 * ca;
      ctx.beginPath(); ctx.moveTo(cx2 - s, cy2); ctx.lineTo(cx2 - s * 0.1, cy2 + s * 0.8); ctx.lineTo(cx2 + s, cy2 - s * 0.9); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // the PHONE capture beat (the critic: 'captures' plural, one drawn): the second real capture,
    // the studio on a phone — its own beat between the desktop card and the gates
    if (t >= 14.4 && t < 16.9) {
      const img2 = shots['assets_phone.png'];
      const a3 = M.clamp((t - 14.4) / 0.5, 0, 1) * M.clamp(1 - (t - 16.4) / 0.4, 0, 1);
      const cw2 = W * 0.42, ch2 = H * 0.72, cx3 = (W - cw2) / 2, cy3 = H * 0.10;
      ctx.save(); ctx.globalAlpha = a3;
      ctx.beginPath(); M.rrect(ctx, cx3, cy3, cw2, ch2, u * 3.0); ctx.clip();
      const sc2 = Math.max(cw2 / img2.width, ch2 / img2.height);
      ctx.drawImage(img2, (img2.width - cw2 / sc2) / 2, (img2.height - ch2 / sc2) / 2, cw2 / sc2, ch2 / sc2, cx3, cy3, cw2, ch2);
      ctx.restore();
      ctx.strokeStyle = 'rgba(236,236,239,0.28)'; ctx.lineWidth = 2; M.rrect(ctx, cx3, cy3, cw2, ch2, u * 3.0); ctx.stroke();
    }
    // the payoff strip: "verify: PASS" — its own beat
    if (t > 17.9 && t < 19.9) {
      const a2 = M.clamp((t - 17.9) / 0.4, 0, 1) * M.clamp(1 - (t - 19.6) / 0.25, 0, 1);   // a solid hold
      const sw3 = W * 0.82 * a2;
      ctx.globalAlpha = Math.min(1, a2 * 1.4);
      ctx.fillStyle = D.c.accent; M.rrect(ctx, (W - sw3) / 2, H * 0.38, sw3, u * 20, u * 3.0); ctx.fill();   // the BIG stamp, centered
      if (a2 > 0.5) {
        ctx.fillStyle = '#08080a'; ctx.font = `800 ${u * 9.5}px "JetBrains Mono", monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('verify: PASS', W / 2, H * 0.38 + u * 10);
      }
      ctx.globalAlpha = 1;
    }

    // the end card (a clean dim-out backdrop first: the screenshot fades under it)
    if (t >= 20.0) {
      const fade = M.clamp((t - 20.0) / 0.5, 0, 1); ctx.fillStyle = `rgba(8,8,10,${fade})`; ctx.fillRect(0, 0, W, H);
      // a slow push-in on the whole card (motion through the finale)
      const push = 1 + 0.06 * M.clamp((t - 20.4) / 4.4, 0, 1);
      ctx.save(); ctx.translate(W / 2, H * 0.44); ctx.scale(push, push); ctx.translate(-W / 2, -H * 0.44);
      ctx.globalAlpha = finale;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = D.c.ink; ctx.font = `800 ${u * 10}px "Space Grotesk", sans-serif`;
      ctx.fillText('made by', W / 2, H * 0.30);
      // the payoff line: ONE draw, breathing (a scale pulse = the end card's motion)
      const br2 = 1 + 0.07 * Math.sin((t - 20.0) * 2.2);   // a visible breath
      ctx.save(); ctx.translate(W / 2, H * 0.44); ctx.scale(br2, br2);
      ctx.fillStyle = D.c.accent2; ctx.font = `800 ${u * 13.5}px "Space Grotesk", sans-serif`;
      ctx.textAlign = 'center'; ctx.fillText('one sentence.', 0, 0); ctx.restore();
      ctx.fillStyle = D.c.ink; ctx.font = `700 ${u * 7.2}px "Space Grotesk", sans-serif`;
      ctx.fillText('Motion Studio', W / 2, H * 0.58);
      // a live accent line under the name (thicker: a moving region)
      const bw = u * 44 * (0.5 + 0.5 * Math.abs(Math.sin((t - 20.0) * 1.9)));   // the underline breathes, visibly
      ctx.fillStyle = D.c.accent; M.rrect(ctx, W / 2 - bw / 2, H * 0.615, bw, u * 1.6, u * 0.8); ctx.fill();
      ctx.restore();   // the push-in ends
      ctx.globalAlpha = 1;
    }
  },
});
</script>
